
name: NetDevOps CI/CD Pipeline
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  validate-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify pre-flight eAPI Reachability
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/01_precheck.yml
      - name: Generate Configuration Files
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/generate_config.yml
      - name: CI - Pre-Flight Dry Run of Configuration Deployment
        if: github.event_name == 'pull_request'
        run: |  
          ansible-playbook -i inventory/hosts.yml playbooks/deploy_config.yml --check --diff
      - name: CD - Live Fabric Deployment (Merge to main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/deploy_config.yml
      - name: Post-Deployment Fabric Verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/verify_fabric.yml
    