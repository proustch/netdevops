ip routing
hostname spine1
ip name-server 8.8.8.8
ip name-server 1.1.1.1

ntp server 172.20.20.1

interface Loopback0
    description "Router-ID - Management Loopback"
    ip address 10.1.0.1/32

interface Ethernet1
  description p2p_leaf1
  no switchport
  ip address 10.1.1.1/30
interface Ethernet2
  description p2p_leaf2
  no switchport
  ip address 10.1.1.5/30
interface Ethernet3
  description p2p_leaf3
  no switchport
  ip address 10.1.1.9/30
interface Ethernet4
  description p2p_leaf4
  no switchport
  ip address 10.1.1.13/30


router bgp 65000
 no shutdown

 router-id 10.1.0.1

 no bgp default ipv4-unicast
neighbor 10.1.1.2 remote-as 65101
neighbor 10.1.1.6 remote-as 65102
neighbor 10.1.1.10 remote-as 65103
neighbor 10.1.1.14 remote-as 65104
address-family ipv4
 neighbor 10.1.1.2 activate
 neighbor 10.1.1.6 activate
 neighbor 10.1.1.10 activate
 neighbor 10.1.1.14 activate

