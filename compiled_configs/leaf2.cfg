ip routing
hostname leaf2
ip name-server 8.8.8.8
ip name-server 1.1.1.1

ntp server 172.20.20.1

interface Loopback0
    description "Router-ID - Management Loopback"
    ip address 10.1.0.12/32

interface Ethernet1
  description p2p_spine1
  no switchport
  ip address 10.1.1.6/30
interface Ethernet2
  description p2p_spine2
  no switchport
  ip address 10.1.2.6/30

vlan 10
 name web
vlan 20
 name app
vlan 30
 name bd

router bgp 65102
 no shutdown

 router-id 10.1.0.12

 no bgp default ipv4-unicast

